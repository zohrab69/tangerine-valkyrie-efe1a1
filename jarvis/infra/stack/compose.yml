# JARVIS local stack: n8n Assistant sandbox (+ optional n8n and web search)
#
# Based on n8n's official docker/get-n8n-compose.yml (compose-version 2),
# changed for an 8 GB Windows laptop that ALREADY runs n8n:
#
#   * The sandbox services never read the shared .env. Each one gets its own
#     small env file (sandbox-api.env / sandbox-runner.env), so your OpenAI key
#     and n8n settings never reach the code-execution containers
#     (n8n security checklist).
#   * n8n is behind the "n8n" profile. By default it is NOT started, so this
#     file cannot create a second n8n on port 5678. Path A connects your
#     existing n8n container to the "jarvis-net" network instead.
#   * When you migrate (Path B), the n8n service uses your EXISTING volume
#     "n8n_data" (external: true), so Compose can never create an empty one.
#   * SearXNG web search is optional (profile "search") to save memory.
#   * Memory caps keep the stack from freezing the laptop.
#   * No sandbox ports are published to Windows.
#
# Commands (run from this folder):
#   docker compose up -d                       sandbox only (Path A)
#   docker compose --profile search up -d      + SearXNG web search
#   docker compose --profile n8n up -d         + n8n managed here (Path B)
#   docker compose stop                        free the RAM when not building

name: jarvis

networks:
  jarvis-net:
    name: jarvis-net

volumes:
  sandbox-tls:
  n8n_data:
    external: true   # your existing data volume; must already exist
    name: n8n_data

configs:
  searxng_settings:
    content: |
      use_default_settings: true
      search:
        formats:
          - html
          - json

services:
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:?set N8N_SANDBOX_VERSION in .env}
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls
    networks: [jarvis-net]

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    env_file: sandbox-api.env
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks: [jarvis-net]
    # No "ports:". n8n reaches it as http://sandbox-api:8080 on jarvis-net.

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION}
    privileged: true   # Docker-in-Docker. Treat as root on the host. Never expose.
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file: sandbox-runner.env
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    mem_limit: 2g
    networks: [jarvis-net]

  searxng:
    profiles: [search]
    image: ghcr.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    mem_limit: 384m
    networks: [jarvis-net]

  # Path B only: n8n managed by this file, using your EXISTING n8n_data volume.
  # Start it only via infra/windows/06-migrate-n8n-to-compose.ps1, which stops
  # the old container first and checks the version is not a downgrade.
  n8n:
    profiles: [n8n]
    image: docker.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env (never lower than your current version)}
    container_name: jarvis-n8n
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    ports:
      - '127.0.0.1:5678:5678'   # localhost only; nothing else on your Wi-Fi can reach it
    env_file: n8n.env
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1536m
    networks: [jarvis-net]
